version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal_metrology_backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB_NAME=legal_metrology_db
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/inspection-pipeline
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/reports:/app/reports
    depends_on:
      - mongo

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: legal_metrology_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    depends_on:
      - backend

  mongo:
    image: mongo:6.0
    container_name: legal_metrology_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  n8n_data:
  mongo_data:
